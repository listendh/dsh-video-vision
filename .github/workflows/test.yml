name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Verify the tool end to end
        run: node test/verify.mjs

      - name: Keep the sampled frames for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.os }}
          path: .verify/frame-*.jpg
          if-no-files-found: ignore
